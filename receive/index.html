<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<title>Respool — filament from £2 a kilo</title>
<meta name="description" content="Buy recycled and branded filament. Credit from your scrap is worth double on recycled spools.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/respool/app.css">

<!-- ===================================================================
     RUNTIME CONFIG — replace placeholders at deploy time.
     Everything the app reads lives on window.RESPOOL_CONFIG.
     Prices, credit rates and the redemption multiplier are CONFIG,
     NOT CODE (SPEC §19). Nothing below is hardcoded in app.js.
     =================================================================== -->
<script>
window.RESPOOL_CONFIG = {
  SUPABASE_URL: "SUPABASE_URL",
  SUPABASE_ANON_KEY: "SUPABASE_ANON_KEY",

  // Stripe — TODO: wire publishable key + PaymentIntent endpoint (§14.8)
  STRIPE_PUBLISHABLE_KEY: "STRIPE_PUBLISHABLE_KEY",
  STRIPE_CHECKOUT_ENDPOINT: "/functions/v1/create-payment-intent",

  // Pricing engine outputs (§9) — served from `pricing_config` in prod.
  creditMultiplierRecycled: 2,       // §3.2 — 2x on recycled
  creditMultiplierBranded: 1,        // face value on branded
  creditMaxSharePct: 0.75,           // credit may cover at most this share of face price
                                     // (recycler + carrier still need real cash)
  orderCreditPct: 0.05,              // every order earns credit (§14.7)
  freeShippingThreshold: 40.00,      // £, §14.3
  shippingFlat: 3.95,
  creditRatePerKg: { PLA: 2.00, PETG: 2.40 },   // §3.1 estimate rates
  boxCapacityKg: { small: 2.5, large: 6.0 },
  currency: "GBP",

  // Demo mode: render seeded catalogue when Supabase creds are placeholders.
  DEMO: true
};
</script>
<!-- Deploy-time overrides from the server's environment. MUST come after the
     block above: /config.js merges over it and only for keys that are actually
     set, so an unconfigured deploy still falls back to demo mode. -->
<script src="/respool/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<!-- ============ APP HEADER (wallet always visible — §14.2) ============ -->
<header class="appbar" id="appbar">
  <button class="appbar-back" id="backBtn" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="mark" id="markHome"><i></i><span>Respool</span></div>
  <h1 class="appbar-title" id="appbarTitle" hidden></h1>
  <button class="wallet-pill" id="walletPill" aria-label="Your credit balance">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 8h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 8l3-4h12l3 4"/></svg>
    <b id="walletPillAmt">£0.00</b>
  </button>
  <button class="basket-btn" id="basketBtn" aria-label="Basket">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2l-4 6h20l-4-6"/><path d="M2 8h20l-1.5 12a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2z"/></svg>
    <span class="basket-count" id="basketCount" hidden>0</span>
  </button>
</header>

<!-- ============ SCREEN STACK ============ -->
<main id="screens">
  <section class="screen" id="screen-shop" data-screen="shop"></section>
  <section class="screen" id="screen-product" data-screen="product"></section>
  <section class="screen" id="screen-wallet" data-screen="wallet"></section>
  <section class="screen" id="screen-scrap" data-screen="scrap"></section>
  <section class="screen" id="screen-account" data-screen="account"></section>
  <section class="screen" id="screen-basket" data-screen="basket"></section>
  <section class="screen" id="screen-checkout" data-screen="checkout"></section>
  <section class="screen" id="screen-claim" data-screen="claim"></section>
</main>

<!-- ============ BOTTOM TABS (thumb reach) ============ -->
<nav class="tabbar" id="tabbar" role="tablist" aria-label="Main">
  <button class="tab" data-tab="shop" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3v5.8M12 15.2V21M3 12h5.8M15.2 12H21"/></svg>
    <span>Shop</span>
  </button>
  <button class="tab" data-tab="wallet" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 8l3-4h12l3 4"/><circle cx="17" cy="14" r="1.3"/></svg>
    <span>Wallet</span>
  </button>
  <button class="tab tab-accent" data-tab="scrap" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l9-4.5 9 4.5v7L12 20l-9-4.5z"/><path d="M3 8.5l9 4.5 9-4.5M12 13v7"/></svg>
    <span>Send scrap</span>
  </button>
  <button class="tab" data-tab="account" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
    <span>Account</span>
  </button>
</nav>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- ============ SHEET (auth / filters / rate detail) ============ -->
<div class="sheet-scrim" id="sheetScrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <button class="sheet-grab" id="sheetClose" aria-label="Close"></button>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script src="/respool/app.js"></script>
</body>
</html>
